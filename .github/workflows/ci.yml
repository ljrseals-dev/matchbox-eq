name: MatchboxEQ CI

on:
  push:
    branches: [main, qa/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dsp-and-reference-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python reference dependencies
        run: python -m pip install --upgrade pip numpy scipy

      - name: Configure framework-free C++ tests
        run: cmake -S . -B build -DMATCHBOX_BUILD_PLUGIN=OFF -DMATCHBOX_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build DSP tests
        run: cmake --build build --parallel

      - name: Run C++ DSP tests
        run: ctest --test-dir build --output-on-failure

      - name: Run Python reference tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate checked-in WAV samples and group energies
        run: python scripts/validate_samples.py
